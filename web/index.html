<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">
  <title>Jarvis</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <!-- Pantalla de entrada -->
    <section id="login" hidden>
      <h1>Jarvis</h1>
      <p class="sub">Entrá con tu contraseña</p>
      <form id="login-form" autocomplete="on">
        <label for="password" class="sr-only">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="Contraseña" required>
        <button type="submit" id="login-button">Entrar</button>
        <p id="login-error" role="alert"></p>
      </form>
    </section>

    <!-- Chat -->
    <section id="chat" hidden>
      <header>
        <h1>Jarvis</h1>
        <div class="header-actions">
          <button type="button" id="voice-toggle" aria-pressed="true" aria-label="Voz de Jarvis" title="Voz de Jarvis">🔊</button>
          <button type="button" id="logout" aria-label="Salir" title="Salir">Salir</button>
        </div>
      </header>

      <div id="messages" role="log" aria-live="polite"></div>

      <form id="composer" autocomplete="off">
        <label for="text" class="sr-only">Mensaje</label>
        <input id="text" name="text" type="text" enterkeyhint="send" autocapitalize="sentences"
               autocomplete="off" placeholder="Escribí o tocá el micrófono" maxlength="500">
        <button type="button" id="mic" aria-label="Hablar" title="Hablar">🎤</button>
        <button type="submit" id="send" aria-label="Enviar">Enviar</button>
      </form>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
